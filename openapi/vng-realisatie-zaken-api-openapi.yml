openapi: 3.2.0
info:
  title: Zaken API
  version: 1.5.1
  description: Een API om een zaakregistratiecomponent (ZRC) te benaderen.
  contact:
    email: standaarden.ondersteuning@vng.nl
    url: https://vng-realisatie.github.io/gemma-zaken
  license:
    name: EUPL 1.2
    url: https://opensource.org/licenses/EUPL-1.2
servers:
- url: https://zaken-api.vng.cloud/api/v1/
  description: Productie Omgeving
tags:
- name: zaken
  description: Een zaak mag (in principe) niet meer gewijzigd worden als de `archiefstatus` een andere status heeft dan "nog_te_archiveren". Voor praktische redenen is er geen harde validatie regel aan de provider kant.
paths:
  /zaken:
    get:
      operationId: zaak_list
      description: Deze lijst kan gefilterd wordt met query-string parameters.
      summary: Alle ZAAKen opvragen
      parameters:
      - name: identificatie
        required: false
        in: query
        description: De unieke identificatie van de ZAAK binnen de organisatie die verantwoordelijk is voor de behandeling van de ZAAK.
        schema:
          type: string
      - name: bronorganisatie
        required: false
        in: query
        description: Het RSIN van de Niet-natuurlijk persoon zijnde de organisatie die de zaak heeft gecreeerd. Dit moet een geldig RSIN zijn van 9 nummers en voldoen aan https://nl.wikipedia.org/wiki/Burgerservicenummer#11-proef
        schema:
          type: string
      - name: bronorganisatie__in
        required: false
        in: query
        description: Multiple values may be separated by commas.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: zaaktype
        required: false
        in: query
        description: URL-referentie naar het ZAAKTYPE (in de Catalogi API) in de CATALOGUS waar deze voorkomt
        schema:
          type: string
          format: uri
      - name: archiefnominatie
        required: false
        in: query
        description: Aanduiding of het zaakdossier blijvend bewaard of na een bepaalde termijn vernietigd moet worden.
        schema:
          type: string
          enum:
          - blijvend_bewaren
          - vernietigen
      - name: archiefnominatie__in
        required: false
        in: query
        description: Multiple values may be separated by commas.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: archiefactiedatum
        required: false
        in: query
        description: De datum waarop het gearchiveerde zaakdossier vernietigd moet worden dan wel overgebracht moet worden naar een archiefbewaarplaats. Wordt automatisch berekend bij het aanmaken of wijzigen van een RESULTAAT aan deze ZAAK indien nog leeg.
        schema:
          type: string
      - name: archiefactiedatum__lt
        required: false
        in: query
        description: De datum waarop het gearchiveerde zaakdossier vernietigd moet worden dan wel overgebracht moet worden naar een archiefbewaarplaats. Wordt automatisch berekend bij het aanmaken of wijzigen van een RESULTAAT aan deze ZAAK indien nog leeg.
        schema:
          type: string
      - name: archiefactiedatum__gt
        required: false
        in: query
        description: De datum waarop het gearchiveerde zaakdossier vernietigd moet worden dan wel overgebracht moet worden naar een archiefbewaarplaats. Wordt automatisch berekend bij het aanmaken of wijzigen van een RESULTAAT aan deze ZAAK indien nog leeg.
        schema:
          type: string
      - name: archiefactiedatum__isnull
        required: false
        in: query
        description: De datum waarop het gearchiveerde zaakdossier vernietigd moet worden dan wel overgebracht moet worden naar een archiefbewaarplaats. Wordt automatisch berekend bij het aanmaken of wijzigen van een RESULTAAT aan deze ZAAK indien nog leeg.
        schema:
          type: string
      - name: archiefstatus
        required: false
        in: query
        description: Aanduiding of het zaakdossier blijvend bewaard of na een bepaalde termijn vernietigd moet worden.
        schema:
          type: string
          enum:
          - nog_te_archiveren
          - gearchiveerd
          - gearchiveerd_procestermijn_onbekend
          - overgedragen
      - name: archiefstatus__in
        required: false
        in: query
        description: Multiple values may be separated by commas.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: startdatum
        required: false
        in: query
        description: De datum waarop met de uitvoering van de zaak is gestart
        schema:
          type: string
      - name: startdatum__gt
        required: false
        in: query
        description: De datum waarop met de uitvoering van de zaak is gestart
        schema:
          type: string
      - name: startdatum__gte
        required: false
        in: query
        description: De datum waarop met de uitvoering van de zaak is gestart
        schema:
          type: string
      - name: startdatum__lt
        required: false
        in: query
        description: De datum waarop met de uitvoering van de zaak is gestart
        schema:
          type: string
      - name: startdatum__lte
        required: false
        in: query
        description: De datum waarop met de uitvoering van de zaak is gestart
        schema:
          type: string
      - name: registratiedatum
        required: false
        in: query
        description: De datum waarop de zaakbehandelende organisatie de ZAAK heeft geregistreerd. Indien deze niet opgegeven wordt, wordt de datum van vandaag gebruikt.
        schema:
          type: string
      - name: registratiedatum__gt
        required: false
        in: query
        description: De datum waarop de zaakbehandelende organisatie de ZAAK heeft geregistreerd. Indien deze niet opgegeven wordt, wordt de datum van vandaag gebruikt.
        schema:
          type: string
      - name: registratiedatum__lt
        required: false
        in: query
        description: De datum waarop de zaakbehandelende organisatie de ZAAK heeft geregistreerd. Indien deze niet opgegeven wordt, wordt de datum van vandaag gebruikt.
        schema:
          type: string
      - name: einddatum
        required: false
        in: query
        description: De datum waarop de uitvoering van de zaak afgerond is.
        schema:
          type: string
      - name: einddatum__gt
        required: false
        in: query
        description: De datum waarop de uitvoering van de zaak afgerond is.
        schema:
          type: string
      - name: einddatum__lt
        required: false
        in: query
        description: De datum waarop de uitvoering van de zaak afgerond is.
        schema:
          type: string
      - name: einddatum__isnull
        required: false
        in: query
        description: De datum waarop de uitvoering van de zaak afgerond is.
        schema:
          type: string
      - name: einddatumGepland
        required: false
        in: query
        description: De datum waarop volgens de planning verwacht wordt dat de zaak afgerond wordt.
        schema:
          type: string
      - name: einddatumGepland__gt
        required: false
        in: query
        description: De datum waarop volgens de planning verwacht wordt dat de zaak afgerond wordt.
        schema:
          type: string
      - name: einddatumGepland__lt
        required: false
        in: query
        description: De datum waarop volgens de planning verwacht wordt dat de zaak afgerond wordt.
        schema:
          type: string
      - name: uiterlijkeEinddatumAfdoening
        required: false
        in: query
        description: De laatste datum waarop volgens wet- en regelgeving de zaak afgerond dient te zijn.
        schema:
          type: string
      - name: uiterlijkeEinddatumAfdoening__gt
        required: false
        in: query
        description: De laatste datum waarop volgens wet- en regelgeving de zaak afgerond dient te zijn.
        schema:
          type: string
      - name: uiterlijkeEinddatumAfdoening__lt
        required: false
        in: query
        description: De laatste datum waarop volgens wet- en regelgeving de zaak afgerond dient te zijn.
        schema:
          type: string
      - name: rol__betrokkeneType
        required: false
        in: query
        description: Type van de `betrokkene`.
        schema:
          type: string
          enum:
          - natuurlijk_persoon
          - niet_natuurlijk_persoon
          - vestiging
          - organisatorische_eenheid
          - medewerker
      - name: rol__betrokkene
        required: false
        in: query
        description: URL-referentie naar een betrokkene gerelateerd aan de ZAAK.
        schema:
          type: string
          format: uri
      - name: rol__omschrijvingGeneriek
        required: false
        in: query
        description: Algemeen gehanteerde benaming van de aard van de ROL, afgeleid uit het ROLTYPE.
        schema:
          type: string
          enum:
          - adviseur
          - behandelaar
          - belanghebbende
          - beslisser
          - initiator
          - klantcontacter
          - zaakcoordinator
          - mede_initiator
      - name: maximaleVertrouwelijkheidaanduiding
        required: false
        in: query
        description: Zaken met een vertrouwelijkheidaanduiding die beperkter is dan de aangegeven aanduiding worden uit de resultaten gefiltered.
        schema:
          type: string
          enum:
          - openbaar
          - beperkt_openbaar
          - intern
          - zaakvertrouwelijk
          - vertrouwelijk
          - confidentieel
          - geheim
          - zeer_geheim
      - name: rol__betrokkeneIdentificatie__natuurlijkPersoon__inpBsn
        required: false
        in: query
        description: Het burgerservicenummer, bedoeld in artikel 1.1 van de Wet algemene bepalingen burgerservicenummer.
        schema:
          type: string
          maxLength: 9
      - name: rol__betrokkeneIdentificatie__natuurlijkPersoon__anpIdentificatie
        required: false
        in: query
        description: Het door de gemeente uitgegeven unieke nummer voor een ANDER NATUURLIJK PERSOON
        schema:
          type: string
          maxLength: 17
      - name: rol__betrokkeneIdentificatie__natuurlijkPersoon__inpA_nummer
        required: false
        in: query
        description: Het administratienummer van de persoon, bedoeld in de Wet BRP
        schema:
          type: string
          maxLength: 10
      - name: rol__betrokkeneIdentificatie__nietNatuurlijkPersoon__innNnpId
        required: false
        in: query
        description: Het door een kamer toegekend uniek nummer voor de INGESCHREVEN NIET-NATUURLIJK PERSOON
        schema:
          type: string
      - name: rol__betrokkeneIdentificatie__nietNatuurlijkPersoon__annIdentificatie
        required: false
        in: query
        description: Het door de gemeente uitgegeven unieke nummer voor een ANDER NIET-NATUURLIJK PERSOON
        schema:
          type: string
          maxLength: 17
      - name: rol__betrokkeneIdentificatie__vestiging__vestigingsNummer
        required: false
        in: query
        description: Een korte unieke aanduiding van de Vestiging.
        schema:
          type: string
          maxLength: 24
      - name: rol__betrokkeneIdentificatie__medewerker__identificatie
        required: false
        in: query
        description: Een korte unieke aanduiding van de MEDEWERKER.
        schema:
          type: string
          maxLength: 24
      - name: rol__betrokkeneIdentificatie__organisatorischeEenheid__identificatie
        required: false
        in: query
        description: Een korte identificatie van de organisatorische eenheid.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Het veld waarop de resultaten geordend worden.
        schema:
          type: array
          items:
            type: string
            enum:
            - - startdatum
              - -startdatum
              - einddatum
              - -einddatum
              - publicatiedatum
              - -publicatiedatum
              - archiefactiedatum
              - -archiefactiedatum
        style: form
        explode: false
      - name: expand
        required: false
        in: query
        description: "Examples: \n`expand=zaaktype, status, status.statustype, hoofdzaak.status.statustype, hoofdzaak.deelzaken.status.statustype`\nHaal details van gelinkte resources direct op. Als je meerdere resources tegelijk wilt ophalen kun je deze scheiden met een komma. Voor het ophalen van resources die een laag dieper genest zijn wordt de punt-notatie gebruikt."
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      - in: header
        name: Accept-Crs
        schema:
          type: string
          enum:
          - EPSG:4326
        description: Het gewenste 'Coordinate Reference System' (CRS) van de geometrie in het antwoord (response body). Volgens de GeoJSON spec is WGS84 de default (EPSG:4326 is hetzelfde als WGS84).
        required: true
      - in: header
        name: Content-Crs
        schema:
          type: string
          enum:
          - EPSG:4326
        description: Het 'Coordinate Reference System' (CRS) van de geometrie in de vraag (request body). Volgens de GeoJSON spec is WGS84 de default (EPSG:4326 is hetzelfde als WGS84).
        required: true
      tags:
      - zaken
      security:
      - JWT-Claims:
        - zaken.lezen
      responses:
        '200':
          headers:
            Content-Crs:
              schema:
                type: string
                enum:
                - EPSG:4326
              description: Het 'Coordinate Reference System' (CRS) van de geometrie in de vraag (request body). Volgens de GeoJSON spec is WGS84 de default (EPSG:4326 is hetzelfde als WGS84).
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZaakList'
          description: OK
        '400':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidatieFout'
          description: Bad request
        '401':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Unauthorized
        '403':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Forbidden
        '406':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Not acceptable
        '409':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Conflict
        '410':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Gone
        '412':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Precondition failed
        '415':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Unsupported media type
        '429':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Too many requests
        '500':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Internal server error
    post:
      operationId: zaak_create
      description: 'Indien geen identificatie gegeven is, dan wordt deze automatisch gegenereerd. De identificatie moet uniek zijn binnen de bronorganisatie.


        **Er wordt gevalideerd op:**

        - geldigheid `zaaktype` URL - de resource moet opgevraagd kunnen worden uit de Catalogi API en de vorm van een ZAAKTYPE hebben.

        - `zaaktype` is geen concept (`zaaktype.concept = False`)

        - `laatsteBetaaldatum` mag niet in de toekomst liggen.

        - `laatsteBetaaldatum` mag niet gezet worden als de betalingsindicatie "nvt" is.

        - `barchiefnominatie` moet een waarde hebben indien archiefstatus niet de waarde "nog_te_archiveren" heeft.

        - `archiefactiedatum` moet een waarde hebben indien archiefstatus niet de waarde "nog_te_archiveren" heeft.

        - `archiefstatus` kan alleen een waarde anders dan "nog_te_archiveren" hebben indien van alle gerelateeerde INFORMATIEOBJECTen het attribuut `status` de waarde "gearchiveerd" heeft.'
      summary: Maak een ZAAK aan
      parameters:
      - in: header
        name: Content-Type
        schema:
          type: string
          enum:
          - application/json
        description: Content type van de verzoekinhoud.
        required: true
      - in: header
        name: X-NLX-Logrecord-ID
        schema:
          type: string
        description: Identifier of the request, traceable throughout the network
      - in: header
        name: X-Audit-Toelichting
        schema:
          type: string
        description: Toelichting waarom een bepaald verzoek wordt gedaan
      - in: header
        name: Accept-Crs
        schema:
          type: string
          enum:
          - EPSG:4326
        description: Het gewenste 'Coordinate Reference System' (CRS) van de geometrie in het antwoord (response body). Volgens de GeoJSON spec is WGS84 de default (EPSG:4326 is hetzelfde als WGS84).
        required: true
      - in: header
        name: Content-Crs
        schema:
          type: string
          enum:
          - EPSG:4326
        description: Het 'Coordinate Reference System' (CRS) van de geometrie in de vraag (request body). Volgens de GeoJSON spec is WGS84 de default (EPSG:4326 is hetzelfde als WGS84).
        required: true
      tags:
      - zaken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Zaak'
        required: true
      security:
      - JWT-Claims:
        - zaken.aanmaken
      responses:
        '201':
          headers:
            Content-Crs:
              schema:
                type: string
                enum:
                - EPSG:4326
              description: Het 'Coordinate Reference System' (CRS) van de geometrie in de vraag (request body). Volgens de GeoJSON spec is WGS84 de default (EPSG:4326 is hetzelfde als WGS84).
            Location:
              schema:
                type: string
                format: uri
              description: URL waar de resource leeft.
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zaak'
          description: Created
        '400':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidatieFout'
          description: Bad request
        '401':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Unauthorized
        '403':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Forbidden
        '406':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Not acceptable
        '409':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Conflict
        '410':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Gone
        '412':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Precondition failed
        '415':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Unsupported media type
        '429':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Too many requests
        '500':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Internal server error
  /zaken/{uuid}:
    get:
      operationId: zaak_retrieve
      description: Een specifieke ZAAK opvragen.
      summary: Een specifieke ZAAK opvragen
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
          description: Unieke resource identifier (UUID4)
          title: uuid
        required: true
      - in: header
        name: If-None-Match
        schema:
          type: string
