components:
  schemas:
    Fout:
      type: object
      description: Formaat van HTTP 4xx en 5xx fouten.
      properties:
        type:
          type: string
          description: URI referentie naar het type fout, bedoeld voor developers
          title: type
        code:
          type: string
          description: Systeemcode die het type fout aangeeft
          title: code
        title:
          type: string
          description: Generieke titel voor het type fout
          title: title
        status:
          type: integer
          description: De HTTP status code
          title: status
        detail:
          type: string
          description: Extra informatie bij de fout, indien beschikbaar
          title: detail
        instance:
          type: string
          description: URI met referentie naar dit specifiek voorkomen van de fout. Deze kan gebruikt worden in combinatie met server logs, bijvoorbeeld.
          title: instance
      required:
      - code
      - detail
      - instance
      - status
      - title
    GeometryCollection:
      title: Geometry collection
      description: GeoJSON multi-polygon geometry
      type: object
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.8
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - geometries
        properties:
          geometries:
            type: array
            items:
              $ref: '#/components/schemas/Geometry'
    MultiPolygon:
      title: Multi-polygon
      description: GeoJSON multi-polygon geometry
      type: object
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.7
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - coordinates
        properties:
          coordinates:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Point2D'
    PaginatedZaakList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Zaak'
    MultiPoint:
      title: MultiPoint
      description: GeoJSON multi-point geometry
      type: object
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.3
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - coordinates
        properties:
          coordinates:
            type: array
            items:
              $ref: '#/components/schemas/Point2D'
    BronEnum:
      enum:
      - ac
      - nrc
      - zrc
      - ztc
      - drc
      - brc
      - cmc
      - kc
      - vrc
      type: string
    GeoWithin:
      type: object
      properties:
        within:
          allOf:
          - $ref: '#/components/schemas/GeoJSONGeometry'
          title: within
    OrderingEnum:
      enum:
      - startdatum
      - -startdatum
      - einddatum
      - -einddatum
      - publicatiedatum
      - -publicatiedatum
      - archiefactiedatum
      - -archiefactiedatum
      - registratiedatum
      - -registratiedatum
      - identificatie
      - -identificatie
      type: string
    BlankEnum:
      enum:
      - ''
    Verlenging:
      type:
      - object
      - 'null'
      description: Gegevens omtrent het verlengen van de doorlooptijd van de behandeling van de ZAAK
      properties:
        reden:
          type: string
          description: Omschrijving van de reden voor het verlengen van de behandeling van de zaak.
          title: reden verlenging
          maxLength: 200
        duur:
          type: string
          description: Het aantal werkbare dagen waarmee de doorlooptijd van de behandeling van de ZAAK is verlengd (of verkort) ten opzichte van de eerder gecommuniceerde doorlooptijd.
          title: duur verlenging
          format: duration
      required:
      - duur
      - reden
    Point:
      title: Point
      description: GeoJSON point geometry
      type: object
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.2
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - coordinates
        properties:
          coordinates:
            $ref: '#/components/schemas/Point2D'
    GeoJSONGeometry:
      title: GeoJSONGeometry
      type: object
      oneOf:
      - $ref: '#/components/schemas/Point'
      - $ref: '#/components/schemas/MultiPoint'
      - $ref: '#/components/schemas/LineString'
      - $ref: '#/components/schemas/MultiLineString'
      - $ref: '#/components/schemas/Polygon'
      - $ref: '#/components/schemas/MultiPolygon'
      - $ref: '#/components/schemas/GeometryCollection'
      discriminator:
        propertyName: type
    GeometryTypeEnum:
      type: string
      enum:
      - Point
      - MultiPoint
      - LineString
      - MultiLineString
      - Polygon
      - MultiPolygon
      - Feature
      - FeatureCollection
      - GeometryCollection
    ArchiefstatusEnum:
      enum:
      - nog_te_archiveren
      - gearchiveerd
      - gearchiveerd_procestermijn_onbekend
      - overgedragen
      type: string
    RelevanteZaak:
      type: object
      properties:
        url:
          type: string
          format: uri
          title: URL-referentie naar de ZAAK.
          maxLength: 1000
        aardRelatie:
          allOf:
          - $ref: '#/components/schemas/AardRelatieEnum'
          description: 'Benamingen van de aard van de relaties van andere zaken tot (onderhanden) zaken.


            Uitleg bij mogelijke waarden:


            * `vervolg` - De andere zaak gaf aanleiding tot het starten van de onderhanden zaak.

            * `onderwerp` - De andere zaak is relevant voor cq. is onderwerp van de onderhanden zaak.

            * `bijdrage` - Aan het bereiken van de uitkomst van de andere zaak levert de onderhanden zaak een bijdrage.'
          title: aard relatie
      required:
      - aardRelatie
      - url
    ZaakZoek:
      type: object
      properties:
        zaakgeometrie:
          allOf:
          - $ref: '#/components/schemas/GeoWithin'
          title: GeoWithin
        uuid__in:
          type: array
          items:
            type: string
            format: uuid
            title: ''
          description: Array of unieke resource identifiers (UUID4)
          title: uuid__in
        identificatie:
          type: string
          description: De unieke identificatie van de ZAAK binnen de organisatie die verantwoordelijk is voor de behandeling van de ZAAK.
          title: identificatie
        expand:
          type: string
          description: "Examples: \n`expand=zaaktype, status, status.statustype, hoofdzaak.status.statustype, hoofdzaak.deelzaken.status.statustype`\nHaal details van gelinkte resources direct op. Als je meerdere resources tegelijk wilt ophalen kun je deze scheiden met een komma. Voor het ophalen van resources die een laag dieper genest zijn wordt de punt-notatie gebruikt."
          title: expand
        bronorganisatie:
          type: string
          description: Het RSIN van de Niet-natuurlijk persoon zijnde de organisatie die de zaak heeft gecreeerd. Dit moet een geldig RSIN zijn van 9 nummers en voldoen aan https://nl.wikipedia.org/wiki/Burgerservicenummer#11-proef
          title: bronorganisatie
        bronorganisatie__in:
          type: array
          items:
            type: string
            title: ''
          description: Array van bronorganisaties.
          title: bronorganisatie__in
        zaaktype:
          type: string
          format: uri
          description: URL-referentie naar het ZAAKTYPE (in de Catalogi API) in de CATALOGUS waar deze voorkomt
          title: zaaktype
        zaaktype__in:
          type: array
          items:
            type: string
            format: uri
            title: ''
          description: Array van zaaktypen.
          title: zaaktype__in
        archiefnominatie:
          allOf:
          - $ref: '#/components/schemas/ArchiefnominatieEnum'
          description: 'Aanduiding of het zaakdossier blijvend bewaard of na een bepaalde termijn vernietigd moet worden. Uitleg bij mogelijke waarden: * blijvend_bewaren - Het zaakdossier moet bewaard blijven en op de Archiefactiedatum overgedragen worden naar een archiefbewaarplaats. * vernietigen - Het zaakdossier moet op of na de Archiefactiedatum vernietigd worden.'
          title: archiefnominatie
        archiefnominatie__in:
          type: array
          items:
            type: string
            title: ''
          description: Multiple values may be separated by commas.
          title: archiefnominatie__in
        einddatum:
          type: string
          description: De datum waarop de uitvoering van de zaak afgerond is.
          title: einddatum
        einddatum__gt:
          type: string
          title: einddatum__gt
        einddatum__lt:
          type: string
          title: einddatum__lt
        einddatum__isnull:
          type: boolean
          title: einddatum__isnull
        einddatumGepland:
          type: string
          description: De datum waarop volgens de planning verwacht wordt dat de zaak afgerond wordt.
          title: einddatumGepland
        einddatumGepland__gt:
          type: string
          title: einddatumGepland__gt
        einddatumGepland__lt:
          type: string
          title: einddatumGepland__lt
        uiterlijkeEinddatumAfdoening:
          type: string
          description: De laatste datum waarop volgens wet- en regelgeving de zaak afgerond dient te zijn.
          title: uiterlijkeEinddatumAfdoening
        uiterlijkeEinddatumAfdoening__gt:
          type: string
          title: uiterlijkeEinddatumAfdoening__gt
        uiterlijkeEinddatumAfdoening__lt:
          type: string
          title: uiterlijkeEinddatumAfdoening__lt
        archiefactiedatum:
          type: string
          description: De datum waarop het gearchiveerde zaakdossier vernietigd moet worden dan wel overgebracht moet worden naar een archiefbewaarplaats. Wordt automatisch berekend bij het aanmaken of wijzigen van een RESULTAAT aan deze ZAAK indien nog leeg.
          title: archiefactiedatum
        archiefactiedatum__lt:
          type: string
          title: Archiefactiedatum lt
        archiefactiedatum__gt:
          type: string
          title: Archiefactiedatum gt
        archiefactiedatum__isnull:
          type: boolean
          title: Archiefactiedatum is leeg
          description: De archiefactiedatum is leeg
        archiefstatus:
