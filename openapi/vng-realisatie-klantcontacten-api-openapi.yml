  /_registreer_binnenkomend_telefoongesprek:
    post:
      operationId: registreerbinnekomendtelefoongesprek
      description: 'De operatie waarmee gegevens van een klantcontact kunnen worden geregistreerd.

        De id, het nummer, geregistreerdOp, plaatsgevondenOp, Kanaal, IndicatieGelukt (`True`) en initiatiefnemer worden door de provider bepaald en vastgelegd.


        Indien de betrokkene een bekende Partij betreft worden de partijId en de Rol vastgelegd. de andere properties die ingevuld worden zullen als voorkeurs contactgegevens voor alleen de opvolging van dit klantcontact worden behandeld.


        Indien de betrokkene nog niet als Partij bekend is wordt, na uitvraag van de naam- en contactgegevens, de indicatie_hergebruik gevuld. Als deze True is wordt met de gegevens die bekend zijn een Partij aangemaakt.

        Organisatienaam gevuld --> Soort_Partij = `Organisatie`

        Persoonsnaam gevuld en rol = `Klant --> Soort_Partij = `Persoon`

        Persoonsnaam gevuld en rol = `Vertegenwoordiger` --> Soort_Partij = `Contactpersoon`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registreertelefoongesprek_parameters'
