          minLength: 1
    SoortInhoudsdeel:
      type: string
      description: De typering van het inhoudsdeel.<body><ul><li>`informatieobject` - informatieobject </li><li>`overig_object` - overig object </li><li>`tekst` - tekst </li></ul></body>
      enum:
      - informatieobject
