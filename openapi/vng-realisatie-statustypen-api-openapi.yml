      operationId: statustype_list
      description: Deze lijst kan gefilterd wordt met query-string parameters.
      summary: Alle STATUSTYPEn opvragen
      parameters:
      - name: zaaktype
        required: false
        in: query
        description: URL-referentie naar het ZAAKTYPE van ZAAKen waarin STATUSsen van dit STATUSTYPE bereikt kunnen worden.
        schema:
          type: string
          format: uri
      - name: zaaktypeIdentificatie
        required: false
        in: query
        description: zaaktype_identificatie
        schema:
          type: string
      - name: status
        required: false
        in: query
        description: 'filter objects depending on their concept status:

          * `alles`: Toon objecten waarvan het attribuut `concept` true of false is.

          * `concept`: Toon objecten waarvan het attribuut `concept` true is.

          * `definitief`: Toon objecten waarvan het attribuut `concept` false is (standaard).

          '
        schema:
          type: string
      - name: datumGeldigheid
        required: false
        in: query
        description: filter objecten op hun geldigheids datum.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      tags:
      - statustypen
      security:
      - JWT-Claims:
        - catalogi.lezen
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStatusTypeList'
          description: OK
        '400':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
