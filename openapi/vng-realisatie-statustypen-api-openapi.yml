openapi: 3.2.0
info:
  title: Vng Realisatie Statustypen API
  version: 1.3.1
  contact:
    email: standaarden.ondersteuning@vng.nl
    url: https://vng-realisatie.github.io/gemma-zaken
  license:
    name: EUPL 1.2
    url: https://opensource.org/licenses/EUPL-1.2
  description: 'Operations tagged statustypen across 2 of this provider''s published API definitions: vng-realisatie-catalogi-openapi.yml, vng-realisatie-catalogi-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://catalogi-api.vng.cloud/api/v1
  description: Productie Omgeving
tags:
- name: statustypen
  description: Opvragen en bewerken van STATUSTYPEn van een ZAAKTYPE. Generieke aanduiding van de aard van een status.
paths:
