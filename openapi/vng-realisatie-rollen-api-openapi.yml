openapi: 3.2.0
info:
  title: Vng Realisatie Rollen API
  version: 1.5.1
  contact:
    email: standaarden.ondersteuning@vng.nl
    url: https://vng-realisatie.github.io/gemma-zaken
  license:
    name: EUPL 1.2
    url: https://opensource.org/licenses/EUPL-1.2
  description: 'Operations tagged rollen across 2 of this provider''s published API definitions: vng-realisatie-zaken-openapi.yml, vng-realisatie-zaken-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://zaken-api.vng.cloud/api/v1/
  description: Productie Omgeving
tags:
- name: rollen
  description: ''
paths:
  /rollen:
    get:
      operationId: rol_list
      description: Deze lijst kan gefilterd wordt met query-string parameters.
      summary: Alle ROLlen bij ZAAKen opvragen
      parameters:
      - name: zaak
        required: false
        in: query
        description: URL-referentie naar de ZAAK.
        schema:
          type: string
          format: uri
      - name: betrokkene
        required: false
        in: query
        description: URL-referentie naar een betrokkene gerelateerd aan de ZAAK.
        schema:
          type: string
          format: uri
      - name: betrokkeneType
        required: false
        in: query
        description: Type van de `betrokkene`.
        schema:
          type: string
          enum:
          - natuurlijk_persoon
          - niet_natuurlijk_persoon
          - vestiging
          - organisatorische_eenheid
          - medewerker
      - name: betrokkeneIdentificatie__natuurlijkPersoon__inpBsn
        required: false
        in: query
        description: Het burgerservicenummer, bedoeld in artikel 1.1 van de Wet algemene bepalingen burgerservicenummer.
        schema:
          type: string
      - name: betrokkeneIdentificatie__natuurlijkPersoon__anpIdentificatie
        required: false
        in: query
        description: Het door de gemeente uitgegeven unieke nummer voor een ANDER NATUURLIJK PERSOON
        schema:
          type: string
      - name: betrokkeneIdentificatie__natuurlijkPersoon__inpA_nummer
        required: false
        in: query
        description: Het administratienummer van de persoon, bedoeld in de Wet BRP
        schema:
          type: string
      - name: betrokkeneIdentificatie__nietNatuurlijkPersoon__innNnpId
        required: false
        in: query
        description: Het door een kamer toegekend uniek nummer voor de INGESCHREVEN NIET-NATUURLIJK PERSOON
        schema:
          type: string
      - name: betrokkeneIdentificatie__nietNatuurlijkPersoon__annIdentificatie
        required: false
        in: query
        description: Het door de gemeente uitgegeven unieke nummer voor een ANDER NIET-NATUURLIJK PERSOON
        schema:
          type: string
      - name: betrokkeneIdentificatie__vestiging__vestigingsNummer
        required: false
        in: query
        description: Een korte unieke aanduiding van de Vestiging.
        schema:
          type: string
      - name: betrokkeneIdentificatie__organisatorischeEenheid__identificatie
        required: false
        in: query
        description: Een korte identificatie van de organisatorische eenheid.
        schema:
          type: string
      - name: betrokkeneIdentificatie__medewerker__identificatie
        required: false
        in: query
        description: Een korte unieke aanduiding van de MEDEWERKER.
        schema:
          type: string
      - name: roltype
        required: false
        in: query
        description: URL-referentie naar een roltype binnen het ZAAKTYPE van de ZAAK.
        schema:
          type: string
          format: uri
      - name: omschrijving
        required: false
        in: query
        description: Omschrijving van de aard van de ROL, afgeleid uit het ROLTYPE.
        schema:
          type: string
      - name: omschrijvingGeneriek
        required: false
        in: query
        description: Algemeen gehanteerde benaming van de aard van de ROL, afgeleid uit het ROLTYPE.
        schema:
          type: string
          enum:
          - adviseur
          - behandelaar
          - belanghebbende
          - beslisser
          - initiator
          - klantcontacter
          - zaakcoordinator
          - mede_initiator
      - name: page
        required: false
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      tags:
      - rollen
      security:
      - JWT-Claims:
        - zaken.lezen
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRolList'
          description: OK
        '400':
          headers:
