      operationId: zaakverzoek_list
      description: Alle ZAAK-VERZOEKen opvragen.
      summary: Alle ZAAK-VERZOEKen opvragen
      parameters:
      - name: zaak
        required: false
        in: query
        description: URL-referentie naar de ZAAK.
        schema:
          type: string
          format: uri
      - name: verzoek
        required: false
        in: query
        description: URL-referentie naar het VERZOEK (in de Klantinteractie API)
        schema:
          type: string
          format: uri
      tags:
      - zaakverzoeken
      security:
      - JWT-Claims:
        - zaken.lezen
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZaakVerzoek'
          description: OK
        '400':
