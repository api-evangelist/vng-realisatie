openapi: 3.2.0
info:
  title: Zaken Zaakverzoeken API
  version: 1.5.1
  description: Een API om een zaakregistratiecomponent (ZRC) te benaderen.
  contact:
    email: standaarden.ondersteuning@vng.nl
    url: https://vng-realisatie.github.io/gemma-zaken
  license:
    name: EUPL 1.2
    url: https://opensource.org/licenses/EUPL-1.2
servers:
- url: https://zaken-api.vng.cloud/api/v1/
  description: Productie Omgeving
tags:
- name: zaakverzoeken
  description: ''
paths:
  /zaakverzoeken:
