components:
  schemas:
    Naamlang:
      type: string
      description: ''
      maxLength: 200
    Telefoonnummer:
      type: string
      description: ''
      maxLength: 20
    SoortActor:
      type: string
      description: De typering van de actor.<body><ul><li>`medewerker` - medewerker </li><li>`geautomatiseerde_actor` - geautomatiseerde actor </li><li>`organisatorische_eenheid` - organisatorische eenheid </li></ul></body>
      enum:
      - medewerker
      - geautomatiseerde_actor
      - organisatorische_eenheid
    Emailadres:
      type: string
      description: Een geldig email-adres, maximaal 20 karakters lang en minimaal een @ en een . opgenomen.
      maxLength: 200
    Omschrijvingkort:
      type: string
      description: ''
      maxLength: 40
    OrganisatorischeEenheid:
      allOf:
      - $ref: '#/components/schemas/Actor'
      - type: object
        description: 'Het deel van een functioneel afgebakend onderdeel binnen de organisatie dat haar activiteiten uitvoert binnen een VESTIGING VAN ZAAKBEHANDELENDE ORGANISATIE en die verantwoordelijk is voor de behandeling van zaken.


          Alleen ORGANISATORISCHE EENHEden van de organisaties die zaken behandelen worden hier bedoeld (bijvoorbeeld afdelingen van gemeenten). Dus niet organisatorische eenheden van andere organisaties zoals de externe initiatoren van zaken (bijvoorbeeld de afdeling van een bedrijf die een vergunning aanvraagt). De ORGANISATORISCHE EENHEID zoals hier bedoeld is gehuisvest binnen ????n fysieke vestiging van de organisatie. Als een functioneel afgebakend onderdeel van de organisatie haar activiteiten uitvoert in meerdere vestigingen dan wordt die uitgewisseld als evenveel ORGANISATORISCHE EENHEden als die vestigingen. Door de relatie naar VESTIGING VAN ZAAKBEHANDELENDE ORGANISATIE en daarmee via VESTIGING naar NIET NATUURLIJK PERSOON is bekend om welke zaakbehandelende organisatie het gaat. Een ORGANISATORISCHE EENHEID kan zowel groot als klein zijn. De ene ORGANISATORISCHE EENHEID mag andere ORGANISATORISCHE EENHEden bevatten, maar dit wordt niet gemodelleerd. We beperken ons tot het aangeven welke ORGANISATORISCHE EENHEID welke rol heeft in een ZAAK en welke gegevens daarvan vanuit het oogpunt van een zaak relevant zijn. ORGANISATORISCHE EENHEID is een specialisatie (''subtype'') van BETROKKENE.'
        required:
        - externId
        - externRegister
        properties:
          eMailadres:
            $ref: '#/components/schemas/Emailadres'
          externId:
            $ref: '#/components/schemas/Identificatiecode'
          externRegister:
            $ref: '#/components/schemas/Omschrijvingkort'
          faxnummer:
            $ref: '#/components/schemas/Telefoonnummer'
          omschrijving:
            $ref: '#/components/schemas/Omschrijvingkort'
          telefoonnummer:
            $ref: '#/components/schemas/Telefoonnummer'
    Actor:
      type: object
      description: De acor handelt in een interne taak of een klantcontact.
      required:
      - id
      - indicatieActief
      - naam
      - soortActor
      properties:
        id:
          $ref: '#/components/schemas/Identificatiecode'
        indicatieActief:
          $ref: '#/components/schemas/IndicatieJaNee'
        naam:
          $ref: '#/components/schemas/Naamlang'
        soortActor:
          $ref: '#/components/schemas/SoortActor'
    ZoekOrganisatorischeEenheid_parameters:
      type: object
      description: ''
      properties:
        eMailadres:
          $ref: '#/components/schemas/Emailadres'
        externId:
          $ref: '#/components/schemas/Identificatiecode'
        externRegister:
          $ref: '#/components/schemas/Omschrijvingkort'
        faxnummer:
          $ref: '#/components/schemas/Telefoonnummer'
        naam:
          $ref: '#/components/schemas/Naamlang'
        omschrijving:
          $ref: '#/components/schemas/Omschrijvingkort'
        telefoonnummer:
          $ref: '#/components/schemas/Telefoonnummer'
    IndicatieJaNee:
      type: boolean
      description: ''
    WijzigOrganisatorischeEenheid_parameters:
      type: object
      description: ''
      required:
      - id
      properties:
        eMailadres:
          $ref: '#/components/schemas/Emailadres'
        externId:
          $ref: '#/components/schemas/Identificatiecode'
        externRegister:
          $ref: '#/components/schemas/Omschrijvingkort'
        faxnummer:
          $ref: '#/components/schemas/Telefoonnummer'
        id:
          $ref: '#/components/schemas/Identificatiecode'
        naam:
          $ref: '#/components/schemas/Naamlang'
        omschrijving:
          $ref: '#/components/schemas/Omschrijvingkort'
        telefoonnummer:
          $ref: '#/components/schemas/Telefoonnummer'
    Identificatiecode:
      type: string
      description: ''
      maxLength: 40
    RegistreerOrganisatorischeEenheid_parameters:
      type: object
      description: ''
      required:
      - naam
      properties:
        eMailadres:
          $ref: '#/components/schemas/Emailadres'
        externId:
          $ref: '#/components/schemas/Identificatiecode'
        externRegister:
          $ref: '#/components/schemas/Omschrijvingkort'
        faxnummer:
          $ref: '#/components/schemas/Telefoonnummer'
        naam:
          $ref: '#/components/schemas/Naamlang'
