      description: Deze lijst kan gefilterd wordt met query-string parameters.
      summary: Alle ZAAKOBJECTTYPEn opvragen
      parameters:
      - name: anderObjecttype
        required: false
        in: query
        description: Aanduiding waarmee wordt aangegeven of het ZAAKOBJECTTYPE een ander, niet in RSGB en RGBZ voorkomend, objecttype betreft.
        schema:
          type: string
      - name: catalogus
        required: false
        in: query
        description: URL-referentie naar de CATALOGUS waartoe dit ZAAKOBJECTTYPE behoort.
        schema:
          type: string
          format: uri
      - name: datumBeginGeldigheid
        required: false
        in: query
        description: De datum waarop het is ontstaan.
        schema:
          type: string
      - name: datumEindeGeldigheid
        required: false
        in: query
        description: De datum waarop het is opgeheven.
        schema:
          type: string
      - name: datumGeldigheid
        required: false
        in: query
        description: filter objecten op hun geldigheids datum.
        schema:
          type: string
      - name: objecttype
        required: false
        in: query
        description: URL-referentie naar de OBJECTTYPE waartoe dit ZAAKOBJECTTYPE behoort.
        schema:
          type: string
          format: uri
      - name: relatieOmschrijving
        required: false
        in: query
        description: Omschrijving van de betrekking van het Objecttype op zaken van het gerelateerde ZAAKTYPE.
        schema:
          type: string
      - name: zaaktype
        required: false
        in: query
        description: URL-referentie naar de ZAAKTYPE waartoe dit ZAAKOBJECTTYPE behoort.
        schema:
          type: string
          format: uri
      - name: zaaktypeIdentificatie
        required: false
        in: query
        description: zaaktype_identificatie
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      tags:
      - zaakobjecttypen
      security:
      - JWT-Claims:
        - catalogi.lezen
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZaakObjectTypeList'
          description: OK
        '400':
