openapi: 3.2.0
info:
  title: Catalogi Zaakobjecttypen API
  version: 1.3.1
  description: Een API om een zaaktypecatalogus (ZTC) te benaderen.
  contact:
    email: standaarden.ondersteuning@vng.nl
    url: https://vng-realisatie.github.io/gemma-zaken
  license:
    name: EUPL 1.2
    url: https://opensource.org/licenses/EUPL-1.2
servers:
- url: https://catalogi-api.vng.cloud/api/v1
  description: Productie Omgeving
tags:
- name: zaakobjecttypen
  description: 'Opvragen en bewerken van ZAAKOBJECTTYPEn. Er wordt gevalideerd op:

    - `zaaktype` behoort tot dezelfde `catalogus`'
paths:
