openapi: 3.2.0
info:
  title: Vng Realisatie Roltypen API
  version: 1.3.1
  contact:
    email: standaarden.ondersteuning@vng.nl
    url: https://vng-realisatie.github.io/gemma-zaken
  license:
    name: EUPL 1.2
    url: https://opensource.org/licenses/EUPL-1.2
  description: 'Operations tagged roltypen across 2 of this provider''s published API definitions: vng-realisatie-catalogi-openapi.yml, vng-realisatie-catalogi-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://catalogi-api.vng.cloud/api/v1
  description: Productie Omgeving
tags:
- name: roltypen
  description: Opvragen en bewerken van ROLTYPEn van een ZAAKTYPE. Generieke aanduiding van de aard van een ROL die een BETROKKENE kan uitoefenen in ZAAKen van een ZAAKTYPE.
paths:
  /roltypen:
    get:
      operationId: roltype_list
      description: Deze lijst kan gefilterd wordt met query-string parameters.
      summary: Alle ROLTYPEn opvragen
      parameters:
      - name: zaaktype
        required: false
        in: query
        description: URL-referentie naar het ZAAKTYPE waar deze ROLTYPEn betrokken kunnen zijn.
        schema:
          type: string
          format: uri
      - name: zaaktypeIdentificatie
        required: false
        in: query
        description: zaaktype_identificatie
        schema:
          type: string
      - name: omschrijvingGeneriek
        required: false
        in: query
        description: Algemeen gehanteerde omschrijving van de aard van de ROL.
        schema:
          type: string
          enum:
          - adviseur
          - behandelaar
          - belanghebbende
          - beslisser
          - initiator
          - klantcontacter
          - zaakcoordinator
          - mede_initiator
      - name: status
        required: false
        in: query
        description: 'filter objects depending on their concept status:

          * `alles`: Toon objecten waarvan het attribuut `concept` true of false is.

          * `concept`: Toon objecten waarvan het attribuut `concept` true is.

          * `definitief`: Toon objecten waarvan het attribuut `concept` false is (standaard).

          '
        schema:
          type: string
      - name: datumGeldigheid
        required: false
        in: query
        description: filter objecten op hun geldigheids datum.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      tags:
      - roltypen
      security:
      - JWT-Claims:
        - catalogi.lezen
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRolTypeList'
          description: OK
        '400':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
