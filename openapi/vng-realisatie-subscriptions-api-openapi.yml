  schemas:
    FieldValidationError:
      required:
      - name
      - code
      - reason
      type: object
      properties:
        name:
          title: Name
          description: Naam van het veld met ongeldige gegevens
          type: string
          minLength: 1
        code:
          title: Code
          description: Systeemcode die het type fout aangeeft
          type: string
          minLength: 1
        reason:
          title: Reason
          description: Uitleg wat er precies fout is met de gegevens
          type: string
          minLength: 1
    Fout:
      required:
      - code
      - title
      - status
      - detail
      - instance
      type: object
      properties:
        type:
          title: Type
          description: URI referentie naar het type fout, bedoeld voor developers
          type: string
        code:
          title: Code
          description: Systeemcode die het type fout aangeeft
          type: string
          minLength: 1
        title:
          title: Title
          description: Generieke titel voor het type fout
          type: string
          minLength: 1
        status:
          title: Status
          description: De HTTP status code
          type: integer
        detail:
          title: Detail
          description: Extra informatie bij de fout, indien beschikbaar
          type: string
          minLength: 1
        instance:
          title: Instance
          description: URI met referentie naar dit specifiek voorkomen van de fout. Deze kan gebruikt worden in combinatie met server logs, bijvoorbeeld.
          type: string
          minLength: 1
    ValidatieFout:
      required:
      - code
      - title
      - status
      - detail
      - instance
      - invalidParams
      type: object
      properties:
        type:
          title: Type
          description: URI referentie naar het type fout, bedoeld voor developers
          type: string
        code:
          title: Code
          description: Systeemcode die het type fout aangeeft
          type: string
          minLength: 1
        title:
          title: Title
          description: Generieke titel voor het type fout
          type: string
          minLength: 1
        status:
          title: Status
          description: De HTTP status code
          type: integer
        detail:
          title: Detail
          description: Extra informatie bij de fout, indien beschikbaar
          type: string
          minLength: 1
        instance:
          title: Instance
          description: URI met referentie naar dit specifiek voorkomen van de fout. Deze kan gebruikt worden in combinatie met server logs, bijvoorbeeld.
          type: string
          minLength: 1
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidationError'
    ProtocolSettings:
      type:
      - object
      - 'null'
      properties:
        headers:
          title: Headers
          type: object
          additionalProperties:
            type: string
            maxLength: 255
            minLength: 1
        method:
          title: Method
          type: string
          enum:
          - POST
    Subscription:
      required:
      - protocol
      - sink
      type: object
      properties:
        id:
          title: Id
          description: UUID of the subscription.
          type: string
          format: uuid
          readOnly: true
        protocol:
          title: Protocol
          description: Identifier of a delivery protocol.
          type: string
          enum:
          - HTTP
        protocolSettings:
          $ref: '#/components/schemas/ProtocolSettings'
        sink:
          title: Sink
          description: The address to which events shall be delivered using the selected protocol.
          type: string
          format: uri
          maxLength: 200
          minLength: 1
        sinkCredential:
          $ref: '#/components/schemas/SinkCredential'
        config:
          title: Config
          description: Implementation-specific configuration parameters needed by the subscription manager for acquiring events.
          type:
          - object
          - 'null'
        source:
          title: Source
          description: Source to which the subscription applies. May be implied by the request address.
          type:
          - string
          - 'null'
          maxLength: 255
        domain:
          title: Domain
          description: Domain to which the subscription applies.
          type:
          - string
          - 'null'
        types:
          description: CloudEvent types eligible to be delivered by this subscription.
          type:
          - array
          - 'null'
          items:
            title: Types
            type: string
            maxLength: 255
            minLength: 1
        subscriberReference:
          title: Subscriber reference
          description: Events that are send to the subscriber will contain this reference. The subscriber can use the reference for internal routing of the event.
          type:
          - string
          - 'null'
          maxLength: 255
        filters:
          title: Filters
          description: This filter evaluates to 'true' if all contained filters are 'true'.
          type: object
        url:
          title: Url
          description: URL-referentie naar dit object. Dit is de unieke identificatie en locatie van dit object.
          type: string
          format: uri
          readOnly: true
          maxLength: 1000
          minLength: 1
    SinkCredential:
      required:
      - credentialType
      - accessToken
      - accessTokenExpiresUtc
      - accessTokenType
      type:
      - object
      - 'null'
      properties:
        credentialType:
          title: Credential type
          type: string
          enum:
          - ACCESSTOKEN
        accessToken:
          title: Access token
          type: string
          minLength: 1
        accessTokenExpiresUtc:
          title: Access token expires utc
          type: string
          format: date-time
        accessTokenType:
          title: Access token type
          type: string
          enum:
          - bearer
  requestBodies:
    Subscription:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Subscription'
      required: true
  securitySchemes:
    JWT-Claims:
      type: http
      scheme: bearer
      bearerFormat: JWT
