openapi: 3.2.0
info:
  title: Zaken Zaakobjecten API
  version: 1.5.1
  description: Een API om een zaakregistratiecomponent (ZRC) te benaderen.
  contact:
    email: standaarden.ondersteuning@vng.nl
    url: https://vng-realisatie.github.io/gemma-zaken
  license:
    name: EUPL 1.2
    url: https://opensource.org/licenses/EUPL-1.2
servers:
- url: https://zaken-api.vng.cloud/api/v1/
  description: Productie Omgeving
tags:
- name: zaakobjecten
  description: ''
paths:
  /zaakobjecten:
    get:
      operationId: zaakobject_list
      description: Deze lijst kan gefilterd wordt met query-string parameters.
      summary: Alle ZAAKOBJECTen opvragen
      parameters:
      - name: zaak
        required: false
        in: query
        description: URL-referentie naar de ZAAK.
        schema:
          type: string
          format: uri
      - name: object
        required: false
        in: query
        description: URL-referentie naar de resource die het OBJECT beschrijft.
        schema:
          type: string
          format: uri
      - name: objectType
        required: false
        in: query
        description: Beschrijft het type OBJECT gerelateerd aan de ZAAK. Als er geen passend type is, dan moet het type worden opgegeven onder `objectTypeOverige`.
        schema:
          type: string
          enum:
          - adres
          - besluit
          - buurt
          - enkelvoudig_document
          - gemeente
          - gemeentelijke_openbare_ruimte
          - huishouden
          - inrichtingselement
          - kadastrale_onroerende_zaak
          - kunstwerkdeel
          - maatschappelijke_activiteit
          - medewerker
          - natuurlijk_persoon
          - niet_natuurlijk_persoon
          - openbare_ruimte
          - organisatorische_eenheid
          - pand
          - spoorbaandeel
          - status
          - terreindeel
          - terrein_gebouwd_object
          - vestiging
          - waterdeel
          - wegdeel
          - wijk
          - woonplaats
          - woz_deelobject
          - woz_object
          - woz_waarde
          - zakelijk_recht
          - overige
      - name: page
        required: false
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      tags:
      - zaakobjecten
      security:
      - JWT-Claims:
        - zaken.lezen
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZaakObjectList'
          description: OK
        '400':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidatieFout'
          description: Bad request
        '401':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Unauthorized
        '403':
