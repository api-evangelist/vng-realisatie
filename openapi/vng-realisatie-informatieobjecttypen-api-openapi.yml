components:
  schemas:
    Fout:
      type: object
      description: Formaat van HTTP 4xx en 5xx fouten.
      properties:
        type:
          type: string
          description: URI referentie naar het type fout, bedoeld voor developers
          title: type
        code:
          type: string
          description: Systeemcode die het type fout aangeeft
          title: code
        title:
          type: string
          description: Generieke titel voor het type fout
          title: title
        status:
          type: integer
          description: De HTTP status code
          title: status
        detail:
          type: string
          description: Extra informatie bij de fout, indien beschikbaar
          title: detail
        instance:
          type: string
          description: URI met referentie naar dit specifiek voorkomen van de fout. Deze kan gebruikt worden in combinatie met server logs, bijvoorbeeld.
          title: instance
      required:
      - code
      - detail
      - instance
      - status
      - title
    InformatieObjectType:
      type: object
      description: Serializer based on ``IOT-basis`` specified in XSD ``ztc0310_ent_basis.xsd``.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          title: url
          description: URL-referentie naar dit object. Dit is de unieke identificatie en locatie van dit object.
          minLength: 1
          maxLength: 1000
        catalogus:
          type: string
          format: uri
          description: URL-referentie naar de CATALOGUS waartoe dit INFORMATIEOBJECTTYPE behoort.
          title: Catalogus
        omschrijving:
          type: string
          description: Omschrijving van de aard van informatieobjecten van dit INFORMATIEOBJECTTYPE.
          title: omschrijving
          maxLength: 80
        vertrouwelijkheidaanduiding:
          allOf:
          - $ref: '#/components/schemas/VertrouwelijkheidaanduidingEnum'
          description: 'Aanduiding van de mate waarin informatieobjecten van dit INFORMATIEOBJECTTYPE voor de openbaarheid bestemd zijn.


            Uitleg bij mogelijke waarden:


            * `openbaar` - Openbaar

            * `beperkt_openbaar` - Beperkt openbaar

            * `intern` - Intern

            * `zaakvertrouwelijk` - Zaakvertrouwelijk

            * `vertrouwelijk` - Vertrouwelijk

            * `confidentieel` - Confidentieel

            * `geheim` - Geheim

            * `zeer_geheim` - Zeer geheim'
          title: vertrouwelijkheidaanduiding
        beginGeldigheid:
          type: string
          format: date
          description: De datum waarop het is ontstaan.
          title: datum begin geldigheid
        eindeGeldigheid:
          type:
          - string
          - 'null'
          format: date
          description: De datum waarop het is opgeheven.
          title: datum einde geldigheid
        beginObject:
          type:
          - string
          - 'null'
          format: date
          description: De datum waarop de eerst versie van het object ontstaan is.
          title: datum begin object
        eindeObject:
          type:
          - string
          - 'null'
          format: date
          description: De datum van de aller laatste versie van het object.
          title: datum einde object
        concept:
          type: boolean
          readOnly: true
          description: Geeft aan of het object een concept betreft. Concepten zijn niet-definitieve versies en zouden niet gebruikt moeten worden buiten deze API.
          title: concept
        zaaktypen:
          type: string
          readOnly: true
          title: zaaktypen
        besluittypen:
          type: array
          items:
            type: string
            format: uri
            title: ''
          readOnly: true
          description: URL-referenties naar het INFORMATIEOBJECTTYPE van informatieobjecten waarin besluiten van dit BESLUITTYPE worden vastgelegd.
          title: informatieobjecttypen
          uniqueItems: true
        informatieobjectcategorie:
          type: string
          title: Categorie
          description: Typering van de aard van informatieobjecten van dit INFORMATIEOBJECTTYPE.
          maxLength: 80
        trefwoord:
          type: array
          items:
            type: string
            maxLength: 30
          description: Trefwoord(en) waarmee informatieobjecten van het INFORMATIEOBJECTTYPE kunnen worden gekarakteriseerd. (Gebruik een komma om waarden van elkaar te onderscheiden.)
          title: trefwoord
        omschrijvingGeneriek:
          allOf:
          - $ref: '#/components/schemas/InformatieObjectTypeOmschrijvingGeneriek'
          title: omschrijving generiek
      required:
      - beginGeldigheid
      - besluittypen
      - catalogus
      - concept
      - informatieobjectcategorie
      - omschrijving
      - url
      - vertrouwelijkheidaanduiding
      - zaaktypen
    ValidatieFout:
      type: object
      description: Formaat van HTTP 4xx en 5xx fouten.
      properties:
        type:
          type: string
          description: URI referentie naar het type fout, bedoeld voor developers
          title: type
        code:
          type: string
          description: Systeemcode die het type fout aangeeft
          title: code
        title:
          type: string
          description: Generieke titel voor het type fout
          title: title
        status:
          type: integer
          description: De HTTP status code
          title: status
        detail:
          type: string
          description: Extra informatie bij de fout, indien beschikbaar
          title: detail
        instance:
          type: string
          description: URI met referentie naar dit specifiek voorkomen van de fout. Deze kan gebruikt worden in combinatie met server logs, bijvoorbeeld.
          title: instance
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidationError'
          title: invalidParams
      required:
      - code
      - detail
      - instance
      - invalidParams
      - status
      - title
    InformatieObjectTypeOmschrijvingGeneriek:
      type: object
      properties:
        informatieobjecttypeOmschrijvingGeneriek:
          type: string
          description: Algemeen gehanteerde omschrijving van het type informatieobject.
          title: informatieobjecttype omschrijving generiek
          maxLength: 80
        definitieInformatieobjecttypeOmschrijvingGeneriek:
          type: string
          title: Definitie
          description: Nauwkeurige beschrijving van het generieke type informatieobject
          maxLength: 255
        herkomstInformatieobjecttypeOmschrijvingGeneriek:
          type: string
          title: Herkomst
          description: De naam van de waardenverzameling, of van de beherende organisatie daarvan, waaruit de waarde is overgenomen.
          maxLength: 12
        hierarchieInformatieobjecttypeOmschrijvingGeneriek:
          type: string
          title: Hierarchie
          description: De plaats in de rangorde van het informatieobjecttype.
          maxLength: 80
        opmerkingInformatieobjecttypeOmschrijvingGeneriek:
          type:
          - string
          - 'null'
          title: Opmerking
          description: Zinvolle toelichting bij het informatieobjecttype
          maxLength: 255
      required:
      - definitieInformatieobjecttypeOmschrijvingGeneriek
      - herkomstInformatieobjecttypeOmschrijvingGeneriek
      - hierarchieInformatieobjecttypeOmschrijvingGeneriek
      - informatieobjecttypeOmschrijvingGeneriek
    FieldValidationError:
      type: object
      description: Formaat van validatiefouten.
      properties:
        name:
          type: string
          description: Naam van het veld met ongeldige gegevens
          title: name
        code:
          type: string
          description: Systeemcode die het type fout aangeeft
          title: code
        reason:
          type: string
          description: Uitleg wat er precies fout is met de gegevens
          title: reason
      required:
      - code
      - name
      - reason
    VertrouwelijkheidaanduidingEnum:
      enum:
      - openbaar
      - beperkt_openbaar
      - intern
      - zaakvertrouwelijk
      - vertrouwelijk
      - confidentieel
      - geheim
      - zeer_geheim
      type: string
  securitySchemes:
    JWT-Claims:
      type: http
      bearerFormat: JWT
      scheme: bearer
