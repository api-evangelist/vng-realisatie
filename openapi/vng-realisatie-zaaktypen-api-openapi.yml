openapi: 3.2.0
info:
  title: Catalogi Zaaktypen API
  version: 1.3.1
  description: Een API om een zaaktypecatalogus (ZTC) te benaderen.
  contact:
    email: standaarden.ondersteuning@vng.nl
    url: https://vng-realisatie.github.io/gemma-zaken
  license:
    name: EUPL 1.2
    url: https://opensource.org/licenses/EUPL-1.2
servers:
- url: https://catalogi-api.vng.cloud/api/v1
  description: Productie Omgeving
tags:
- name: zaaktypen
  description: Opvragen en bewerken van ZAAKTYPEn nodig voor ZAKEN in de Zaken API.Een ZAAKTYPE beschrijft het geheel van karakteristieke eigenschappen van zaken van eenzelfde soort.
paths:
  /zaaktypen:
    get:
      operationId: zaaktype_list
      description: Deze lijst kan gefilterd wordt met query-string parameters.
      summary: Alle ZAAKTYPEn opvragen
      parameters:
      - name: catalogus
        required: false
        in: query
        description: URL-referentie naar de CATALOGUS waartoe dit ZAAKTYPE behoort.
        schema:
          type: string
          format: uri
      - name: identificatie
        required: false
        in: query
        description: Unieke identificatie van het ZAAKTYPE binnen de CATALOGUS waarin het ZAAKTYPE voorkomt.
        schema:
          type: string
      - name: trefwoorden
        required: false
        in: query
        description: Multiple values may be separated by commas.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: status
        required: false
        in: query
        description: 'filter objects depending on their concept status:

          * `alles`: Toon objecten waarvan het attribuut `concept` true of false is.

          * `concept`: Toon objecten waarvan het attribuut `concept` true is.

          * `definitief`: Toon objecten waarvan het attribuut `concept` false is (standaard).

          '
        schema:
          type: string
      - name: datumGeldigheid
        required: false
        in: query
        description: filter objecten op hun geldigheids datum.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      tags:
      - zaaktypen
      security:
      - JWT-Claims:
        - (catalogi.lezen | documenten.lezen | zaken.lezen)
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: {}
                      description: Unspecified response body
          description: OK
        '400':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidatieFout'
          description: Bad request
        '401':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
