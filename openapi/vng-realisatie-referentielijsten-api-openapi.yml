components:
  schemas:
    Referentielijstbody:
      type: object
      description: Bevat waarden van referentielijsten.
      properties:
        kanalen:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/Kanaal'
        landen:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/Land'
        soortenDigitaalAdres:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/SoortDigitaalAdres'
        soortenExternId:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/SoortExternId'
        soortenObject:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/SoortObject'
        voorkeurstalen:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/Voorkeurstaal'
    SoortExternId:
      type: object
      description: Een opsomming van de soorten externe identificatiecodes met de bijbehorende externe registers.
      required:
      - code
      - externRegister
      - indicatieActief
      - naam
      - soortPartij
      properties:
        code:
          type: string
          title: Code
          description: De code, behorende bij het soort extern id.
          minLength: 1
        externRegister:
          type: string
          title: Extern register
          description: Het register dat geraadpleegd kan worden m.b.v. de externe identificatiecode.
          minLength: 1
        indicatieActief:
          $ref: '#/components/schemas/IndicatieJaNee'
        naam:
          type: string
          title: Naam
          description: De naam van het soort extern id.
          minLength: 1
        soortPartij:
          $ref: '#/components/schemas/SoortPartij'
    Referentielijsten_parameters:
      type: object
      description: ''
      properties:
        kanaal:
          $ref: '#/components/schemas/IndicatieJaNee'
        land:
          $ref: '#/components/schemas/IndicatieJaNee'
        soortDigitaalAdres:
          $ref: '#/components/schemas/IndicatieJaNee'
        soortExternId:
          $ref: '#/components/schemas/IndicatieJaNee'
        soortObject:
          $ref: '#/components/schemas/IndicatieJaNee'
        voorkeurstaal:
          $ref: '#/components/schemas/IndicatieJaNee'
    SoortPartij:
      type: string
      description: De typering van de partij.
      enum:
      - persoon
      - organisatie
      - contactpersoon
    Voorkeurstaal_parameters:
      type: object
      description: Parameter voor het raadplegen van de voorkeurstaal.
      required:
      - code
      properties:
        code:
          type: string
          title: Code
          description: De code, behorende bij de voorkeurstaal.
          minLength: 1
    Kanaal:
      type: object
      description: Een opsomming van de kanalen waarlangs de gemeente klantcontacten kan hebben.
      required:
      - code
      - indicatieActief
      - naam
      properties:
        code:
          type: string
          title: Code
          description: De code, behorende bij het kanaal.
          minLength: 1
        indicatieActief:
          $ref: '#/components/schemas/IndicatieJaNee'
        naam:
          type: string
          title: Naam
          description: De naam van het kanaal.
          minLength: 1
    SoortObject_parameters:
      type: object
      description: Parameter voor het raadplegen van een Soort object
      required:
      - code
      properties:
        code:
          type: string
          title: Code
          description: De code, behorende bij het soort object.
          minLength: 1
    SoortExternId_parameters:
      type: object
      description: Parameter voor het raadplegen van het soort extern id.
      required:
      - code
      properties:
        code:
          type: string
          title: Code
          description: De code, behorende bij het soort extern id.
          minLength: 1
    Voorkeurstaal:
      type: object
      description: Een opsomming van de talen waarin de gemeente klantcontacten kan hebben.
      required:
      - code
      - indicatieActief
      - naam
      properties:
        code:
          type: string
          title: Code
          description: De code, behorende bij de voorkeurstaal.
          minLength: 1
        indicatieActief:
          $ref: '#/components/schemas/IndicatieJaNee'
        naam:
          type: string
          title: Naam
          description: De naam van de voorkeurstaal.
          minLength: 1
    Kanaal_parameters:
      type: object
      description: Parameter voor het raadplegen van het kanaal.
      required:
      - code
      properties:
        code:
          type: string
          title: Code
          description: De code, behorende bij het kanaal.
          minLength: 1
    SoortObject:
      type: object
      description: Een opsomming van de soorten objecten waarmee een koppeling gelegd wordt vanuit het register klantinteracties.
      required:
      - code
      - indicatieActief
      - naam
      properties:
        code:
          type: string
          title: Code
          description: De code, behorende bij het soort object.
          minLength: 1
        indicatieActief:
          $ref: '#/components/schemas/IndicatieJaNee'
        naam:
          type: string
          title: Naam
          description: De naam van het soort object.
          minLength: 1
    Land:
      type: object
      description: Een opsomming van alle huidige en voormalige landen met hun codes, namen en geldigheidstermijnen.
      required:
      - einddatumLand
      - ingangsdatumLand
      - landcode
      - landnaam
      properties:
        einddatumLand:
          type: string
          title: Einddatum land
          description: De datum waarop het land/gebied is opgeheven.
          format: date
        ingangsdatumLand:
          type: string
          title: Ingangsdatum land
          description: De datum waarop het land/gebied is ontstaan.
          format: date
        landcode:
          type: string
          title: Landcode
          description: De code, behorende bij de landnaam, opgenomen in de Landentabel van de GBA.
          minLength: 1
        landnaam:
          type: string
          title: Landnaam
          description: De naam van het land, zoals opgenomen in de Landentabel van de GBA.
          minLength: 1
    SoortDigitaalAdres:
      type: object
      description: Een opsomming van de type digitaal adres waarlangs de gemeente klantcontacten kan hebben.
      required:
      - code
      - indicatieActief
      - naam
      properties:
        code:
          type: string
          title: Code
          description: De code, behorende bij het soort digitaal adres.
          minLength: 1
        indicatieActief:
          $ref: '#/components/schemas/IndicatieJaNee'
        naam:
          type: string
          title: Naam
          description: De naam van het soort digitaal adres.
          minLength: 1
    SoortDigitaalAdres_parameters:
      type: object
      description: Parameter voor het raadplegen van het kanaal.
      required:
      - code
      properties:
        code:
          type: string
          title: Code
          description: De code, behorende bij het soort digitaal adres.
          minLength: 1
    IndicatieJaNee:
      type: boolean
      description: ''
    Land_parameters:
      type: object
      description: Parameter voor het raadplegen van het kanaal.
      required:
      - landcode
      properties:
        landcode:
          type: string
          title: Landcode
          description: De code, behorende bij de landnaam, opgenomen in de Landentabel van de GBA.
          minLength: 1
