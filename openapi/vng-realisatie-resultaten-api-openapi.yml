openapi: 3.2.0
info:
  title: Vng Realisatie Resultaten API
  license:
    name: EUPL 1.2
    url: https://opensource.org/licenses/EUPL-1.2
  version: '1.0'
  description: 'Operations tagged resultaten across 2 of this provider''s published API definitions: vng-realisatie-referentielijsten-openapi.yml, vng-realisatie-zaken-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://referentielijsten-api.internal/api/v1
- url: https://referentielijsten-api.internal/api/v1
- url: https://zaken-api.vng.cloud/api/v1/
  description: Productie Omgeving
tags:
- name: resultaten
paths:
  /resultaten:
    get:
      tags:
      - resultaten
      summary: Ontsluit de selectielijst resultaten
      description: 'Procestypen worden gerefereerd in zaaktypecatalogi - bij het configureren

        van een zaaktype wordt aangegeven welk procestype van toepassing is, zodat

        het archiefregime van zaken bepaald kan worden.

        Zie https://vng.nl/files/vng/20170706-selectielijst-gemeenten-intergemeentelijke-organen-2017.pdf

        voor de bron van de inhoud.'
      operationId: resultaten_list
      parameters:
      - name: proces_type
        in: query
        description: proces_type
        schema:
          type: string
      - name: page
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      responses:
        200:
          description: Resultaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultaten'
        400:
          description: ValidatieFout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatieFout'
        404:
          description: Fout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fout'
        405:
          description: Fout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fout'
    post:
      operationId: resultaat_create
      description: '**Er wordt gevalideerd op:**

        - geldigheid URL naar de ZAAK

        - geldigheid URL naar het RESULTAATTYPE'
      summary: Maak een RESULTAAT bij een ZAAK aan
      parameters:
      - in: header
        name: Content-Type
        schema:
          type: string
          enum:
          - application/json
        description: Content type van de verzoekinhoud.
        required: true
      - in: header
        name: X-NLX-Logrecord-ID
        schema:
          type: string
        description: Identifier of the request, traceable throughout the network
      - in: header
        name: X-Audit-Toelichting
        schema:
          type: string
        description: Toelichting waarom een bepaald verzoek wordt gedaan
      tags:
      - resultaten
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resultaat_2'
        required: true
      security:
      - JWT-Claims:
        - (zaken.bijwerken | zaken.geforceerd-bijwerken)
      responses:
        '201':
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: URL waar de resource leeft.
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultaat_2'
          description: Created
        '400':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidatieFout_2'
          description: Bad request
        '401':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout_2'
          description: Unauthorized
        '403':
