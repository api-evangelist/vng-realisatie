      summary: Alle VERZENDINGen opvragen
      parameters:
      - name: aardRelatie
        required: false
        in: query
        description: Omschrijving van de aard van de relatie van de BETROKKENE tot het INFORMATIEOBJECT.
        schema:
          type: string
          enum:
          - afzender
          - geadresseerde
      - name: informatieobject
        required: false
        in: query
        description: URL-referentie naar het informatieobject dat is ontvangen of verzonden.
        schema:
          type: string
          format: uri
      - name: betrokkene
        required: false
        in: query
        description: URL-referentie naar de betrokkene waarvan het informatieobject is ontvangen of waaraan dit is verzonden.
        schema:
          type: string
          format: uri
      - name: expand
        required: false
        in: query
        description: "Examples: \n`expand=zaaktype, status, status.statustype, hoofdzaak.status.statustype, hoofdzaak.deelzaken.status.statustype`\nHaal details van gelinkte resources direct op. Als je meerdere resources tegelijk wilt ophalen kun je deze scheiden met een komma. Voor het ophalen van resources die een laag dieper genest zijn wordt de punt-notatie gebruikt."
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      tags:
      - verzendingen
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
