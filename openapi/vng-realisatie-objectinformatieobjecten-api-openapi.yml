          title: instance
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidationError'
          title: invalidParams
      required:
      - code
      - detail
      - instance
      - invalidParams
      - status
      - title
    ObjectInformatieObjectRequest:
      type: object
      properties:
        informatieobject:
          type: string
          format: uri
          description: URL-referentie naar het INFORMATIEOBJECT.
          title: informatieobject
        object:
          type: string
          format: uri
          minLength: 1
          description: URL-referentie naar het gerelateerde OBJECT (in deze of een andere API).
          title: object
          maxLength: 1000
        objectType:
          allOf:
          - $ref: '#/components/schemas/ObjectTypeEnum'
          title: Objecttype
          description: 'Het type van het gerelateerde OBJECT.


            Uitleg bij mogelijke waarden:


            * `besluit` - Besluit

            * `zaak` - Zaak'
      required:
      - informatieobject
      - object
      - objectType
    ObjectInformatieObject:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          title: url
          description: URL-referentie naar dit object. Dit is de unieke identificatie en locatie van dit object.
          minLength: 1
          maxLength: 1000
        informatieobject:
          type: string
          format: uri
          description: URL-referentie naar het INFORMATIEOBJECT.
          title: informatieobject
        object:
          type: string
          format: uri
          description: URL-referentie naar het gerelateerde OBJECT (in deze of een andere API).
          title: object
          maxLength: 1000
        objectType:
          allOf:
          - $ref: '#/components/schemas/ObjectTypeEnum'
          title: Objecttype
          description: 'Het type van het gerelateerde OBJECT.


