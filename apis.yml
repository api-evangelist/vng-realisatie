aid: vng-realisatie

name: VNG Realisatie

description: VNG Realisatie is the implementation organisation of the Vereniging van Nederlandse Gemeenten (VNG, the Association of Netherlands
  Municipalities). It supports municipal development, delivery and enforcement (merged with VNG Naleving on 1 January 2023), and publishes the
  municipal API standards, information models and StUF standards catalogued at standaarden.vng.nl — including Haal Centraal, ZGW (gemma-zaken)
  and Klantinteracties APIs built on the Dutch REST API Design Rules — with source, specifications and Spectral rulesets maintained in the VNG-Realisatie
  GitHub organization.

