  evidence: the document declares 3.0.3
- id: rfc9457
  conforms: true
  evidence: application/problem+json on 1621 response(s), e.g. GET /applicaties 400
- id: idempotency
  conforms: false
  evidence: no idempotency key parameter on mutating operations
- id: pagination
  conforms: true
  evidence: list operations take page
- id: ratelimit-headers
  conforms: true
  evidence: responses declare X-Rate-Limit-Limit, X-Rate-Limit-Remaining, X-Rate-Limit-Reset
