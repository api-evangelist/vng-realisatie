description: 'VNG-Realisatie hosts the ZGW reference implementations in two fully separated environment sets: "stable" (current
  standard or release candidates, bugfix-only, version-tagged, master branches) and "volgende release" (continuously updated
  from develop branches to try new features). Access uses a JWT generated with the token-issuer tool; use of the hosted reference
  implementation is subject to published terms of use (gebruiksvoorwaarden).'
environments:
- name: stable
  hosts:
  - https://zaken-api.vng.cloud
  - https://documenten-api.vng.cloud
  - https://catalogi-api.vng.cloud
  - https://besluiten-api.vng.cloud
  - https://notificaties-api.vng.cloud
  - https://autorisaties-api.vng.cloud
  - https://zaken-auth.vng.cloud
- name: volgende release (test)
  hosts:
  - https://zaken-api.test.vng.cloud
  - https://documenten-api.test.vng.cloud
  - https://catalogi-api.test.vng.cloud
  - https://besluiten-api.test.vng.cloud
  - https://notificaties-api.test.vng.cloud
  - https://autorisaties-api.test.vng.cloud
  - https://zaken-auth.test.vng.cloud
tooling:
